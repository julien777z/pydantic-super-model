[project]
name = "pydantic-super-model"
version = "2.1.0"
description = "Lightweight mixin for generic introspection and Annotated field lookup"
authors = [
    { name = "Julien Kmec", email = "me@julien.dev" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11,<3.16"
dependencies = [
    "pydantic>=2.13.5",
    "python-generics>=0.2.5",
    "typing-inspection>=0.4.2"
]

[project.urls]
Homepage = "https://github.com/julien777z/pydantic-super-model"
Repository = "https://github.com/julien777z/pydantic-super-model"

[project.optional-dependencies]
dev = [
    "black>=26.10.1",
    "isort>=9.0.2",
    "pylint>=4.1.4",
    "pyright>=1.1.414",
]

[dependency-groups]
test = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "coverage>=7.17.5",
    "pytest-cov>=7.1.0",
    "typing-extensions>=4.16.0",
]

[tool.poetry]
packages = [
    { include = "pydantic_super_model" }
]
include = ["pydantic_super_model/py.typed"]

[tool.pytest.ini_options]
filterwarnings = ["error"]
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 110

[tool.pyright]
include = ["pydantic_super_model", "tests", ".github/scripts"]
typeCheckingMode = "strict"

[tool.isort]
profile = "black"
line_length = 110

[tool.pylint.'MESSAGES CONTROL']
disable = [
    "missing-module-docstring",
]

[tool.pylint.format]
max-line-length = 110

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
