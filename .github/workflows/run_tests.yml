name: Run Tests via Pytest

on:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Build and Run Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python and Poetry
        uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ matrix.python-version }}
          post_setup_command: "poetry install -E dev"

      - name: Test with Pytest
        run: |
          poetry run pytest --cov=pydantic_super_model --cov-branch --cov-report=xml

      - name: Set Up Python for Codecov
        uses: actions/setup-python@v7
        with:
          # Codecov's PyPI parser uses PyO3 0.27.1, which supports Python through 3.14.
          python-version: "3.14"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          use_pypi: true
          files: coverage.xml
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
